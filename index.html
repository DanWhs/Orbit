<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Orbit — Smart Start</title>
    <meta name="description" content="Minimal interactive startpage with orbital mascot, dynamic mobile keyboard adaptation, customizable neon accents, and multi-jurisdiction 2026 legal compliance." />
    <meta property="og:title" content="Orbit — Smart Start" />
    <meta property="og:description" content="Minimal interactive startpage with orbital mascot, dynamic mobile keyboard adaptation, customizable neon accents, and multi-jurisdiction 2026 legal compliance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('orbit_theme_v1'));
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
